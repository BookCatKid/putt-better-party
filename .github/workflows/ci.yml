name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: python -m pip install -r requirements-dev.txt
      - run: bun run check

  release:
    # The version/changelog agreement and the source-only archive are checked on
    # every push rather than only on a tag, because a mismatch found at release
    # time has already been merged into someone's branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The archive is built from history, so a shallow clone is not enough.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/release.py check
