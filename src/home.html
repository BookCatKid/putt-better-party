<!doctype html>
<html lang="en" class="dark">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Better Party</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="/assets/styles-S28F_fms.css" />
  <body class="bp-page">
    <main class="bp-home">
      <section class="bp-entry">
        <h1 class="bp-wordmark">better<span>.party</span></h1>
        <button id="create" class="bp-create" type="button">Create a party</button>
        <div class="bp-separator">or join one</div>
        <form id="join">
          <input
            id="code"
            aria-label="Party code"
            placeholder="CODE"
            maxlength="5"
            required
          /><button>Join</button>
        </form>
        <div class="bp-separator">or browse the</div>
        <a class="bp-browse-leaderboard" href="/leaderboard">Leaderboard</a>
        <button id="resume" class="bp-resume" hidden type="button"></button>
        <p id="error" class="bp-entry-error" role="alert"></p>
      </section>
    </main>
    <script src="/assets/bp-home.js" defer></script>
  </body>
</html>
